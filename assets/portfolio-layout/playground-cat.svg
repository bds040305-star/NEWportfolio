<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" role="img" aria-labelledby="title">
  <title id="title">꼬리를 흔들고 눈을 깜빡이는 빨간 고양이</title>
  <defs>
    <pattern id="crayon" width="35" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(-14)">
      <path d="M-5 5 25 1M10 12 39 8M-4 20 22 17M15 28 38 23" fill="none" stroke="#ffad81" stroke-width="2" stroke-linecap="round" opacity=".43"/>
      <path d="M1 9l9-1m14 9 10-1M0 25l8-2m7-9 5-1" fill="none" stroke="#a82b20" stroke-width="1.5" opacity=".25"/>
    </pattern>
    <path id="coat" d="M108 263 83 252l46-23-26-10 58 5-29-25 54 18-17-30 50 26-11-48q-2-8 8-4 35 14 62 44l21-55q4-7 10 1 33 48 36 86 13 10 8 26-4 12-26 19-40 45-105 44-63 5-92-21l-29 4 15-25-27 9z"/>
    <path id="tail-shape" d="M138 243C66 233 36 191 55 146c15-36 53-52 89-40 17 6 31 18 31 31 0 12-13 20-25 14-20-13-42-12-54 1-16 17-9 38 10 53 15 12 32 16 53 20z"/>
  </defs>
  <style>
    .body { animation: hop 2.4s ease-in-out infinite; transform-origin: 54% 78%; }
    .tail { animation: swish 1.2s ease-in-out infinite alternate; transform-origin: 31% 54%; }
    .eyes { animation: blink 3.1s infinite; transform-origin: 69% 56%; }
    .shadow { animation: shadow 2.4s ease-in-out infinite; transform-origin: 49% 83%; }
    @keyframes hop { 0%, 36%, 68%, 100% { transform: translateY(0) rotate(0); } 49% { transform: translateY(-13px) rotate(-3deg); } 60% { transform: translateY(-4px) rotate(1deg); } }
    @keyframes swish { from { transform: rotate(-9deg); } to { transform: rotate(11deg); } }
    @keyframes blink { 0%, 42%, 48%, 100% { transform: scaleY(1); } 45% { transform: scaleY(.08); } }
    @keyframes shadow { 0%, 36%, 68%, 100% { transform: scale(1); opacity: .13; } 49% { transform: scale(.83); opacity: .07; } }
    @media (prefers-reduced-motion: reduce) { .body, .tail, .eyes, .shadow { animation: none; } }
  </style>
  <ellipse class="shadow" cx="215" cy="365" rx="93" ry="10" fill="#63261f"/>
  <g class="body">
    <g class="tail">
      <use href="#tail-shape" fill="#ef351e" stroke="#db3021" stroke-width="3"/>
      <use href="#tail-shape" fill="url(#crayon)"/>
    </g>
    <path fill="#e33420" d="M145 293q-18 19-7 42l10 13q-7 13 10 18l24 1q13-5 0-13l-13-8 1-31m32-4q-17 14-11 31 7 11 18 8 7-4 4-16l10-18m24-3-6 29-15 9q-10 8 1 13 17 4 28-4l27-38z"/>
    <use href="#coat" fill="#f13620" stroke="#e74028" stroke-width="3" stroke-linejoin="round"/>
    <use href="#coat" fill="url(#crayon)"/>
    <path d="m220 170 42 39-28-8zm83-7 18 45-17-3z" fill="#b74b39"/>
    <path d="m278 273 12 47 22-33m3-12 13 38 17-43" fill="#fffdf2" stroke="#6b211c" stroke-width="5" stroke-linejoin="round"/>
    <g class="eyes" fill="#fffdf8" stroke="#6b211c" stroke-width="6">
      <ellipse cx="276" cy="241" rx="23" ry="39" transform="rotate(-29 276 241)"/>
      <ellipse cx="318" cy="225" rx="16" ry="34" transform="rotate(-19 318 225)"/>
      <ellipse cx="292" cy="240" rx="10" ry="19" fill="#632017" stroke="none" transform="rotate(-22 292 240)"/>
      <ellipse cx="328" cy="229" rx="8" ry="17" fill="#632017" stroke="none" transform="rotate(-16 328 229)"/>
    </g>
    <path d="M264 266q-34-12-68-4m69 14q-31 4-58 20m137-41q25-18 45-22m-44 31q27-3 48 2m-52 8q22 7 42 21" fill="none" stroke="#6b211c" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="331" cy="266" rx="16" ry="12" fill="#ff7157" stroke="#9d261c" stroke-width="3" transform="rotate(-18 331 266)"/>
    <ellipse cx="334" cy="262" rx="7" ry="4" fill="#ffe0c5" transform="rotate(-18 334 262)"/>
  </g>
</svg>
